<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCM World Invite — Chicago Team Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
html,body,#map{height:100%;margin:0}body{font-family:Arial}#map{width:100%}.title{position:absolute;z-index:1000;top:8px;left:50%;transform:translateX(-50%);background:#fffffff2;padding:8px 14px;border-radius:9px;box-shadow:0 1px 6px #0004;text-align:center}.title b{font-size:17px}.title div{font-size:11px;color:#555}.panel{background:#fffffff7;padding:10px;border-radius:8px;box-shadow:0 1px 6px #0004;width:285px}.panel h3{margin:0 0 7px}.panel label{display:block;font-size:11px;font-weight:bold;margin:7px 0 3px}.panel input{width:100%;box-sizing:border-box;padding:7px;border:1px solid #aaa;border-radius:5px}.panel button{width:100%;margin-top:6px;padding:7px;border:0;border-radius:5px;background:#245a9b;color:white;font-weight:bold}.panel .secondary{background:#666}.status{font-size:11px;border-top:1px solid #ddd;margin-top:8px;padding-top:7px;line-height:1.4}.rink{width:13px;height:13px;border-radius:50%;background:#1f5aa6;border:2px solid white}.hotel{width:23px;height:23px;border-radius:5px;background:#7a2e8e;color:white;border:2px solid white;display:flex;align-items:center;justify-content:center;font-weight:bold}.starhotel{width:28px;height:28px;border-radius:50%;background:#f2b705;color:#111;border:2px solid white;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 1px 4px #0008}.facility-label,.hotel-label,.input-label{font-size:8px;font-weight:600;padding:1px 3px;white-space:nowrap;box-shadow:none}.facility-label{background:#ffffffcc}.hotel-label{background:#fff8ffea;color:#5c176b}.input-label{background:#fffbe8ea}.facility-label:before,.hotel-label:before,.input-label:before{display:none}.hidden-label{opacity:0!important}.popup b{font-size:14px}.popup div{margin:5px 0}.amenity{font-size:11px;font-weight:bold;color:#725500}.popup button{width:100%;margin-top:5px;padding:7px;border:0;border-radius:5px;background:#245a9b;color:white;font-weight:bold}.legend{background:#fffffff2;padding:7px 9px;border-radius:7px;box-shadow:0 1px 5px #0004;font-size:10px}.legend div{margin:3px}.modalbg{display:none;position:fixed;z-index:3000;inset:0;background:#0008;align-items:center;justify-content:center}.modalbg.open{display:flex}.modal{background:white;border-radius:12px;padding:18px;width:min(430px,90%)}.modal a{display:block;color:white;text-decoration:none;text-align:center;font-weight:bold;padding:10px;margin:8px 0;border-radius:7px}.g{background:#1a73e8}.a{background:#111}.w{background:#087e8b}.modal p{font-size:11px;color:#555}.modal button{width:100%;padding:8px}@media(max-width:700px){.panel{width:220px}.facility-label,.hotel-label,.input-label{font-size:7px}}
</style></head><body><div class="title"><b>CCM World Invite — Chicago Area Facilities</b><div>Route between hotels, rinks, and any searched location.</div></div><div id="map"></div><div id="modal" class="modalbg"><div class="modal"><h2>Choose directions</h2><p id="summary"></p><a id="google" class="g" target="_blank">Google Maps</a><a id="apple" class="a" target="_blank">Apple Maps</a><a id="waze" class="w" target="_blank">Waze</a><p>Google Maps and Apple Maps preserve both endpoints. Waze routes to the destination from your device's current location.</p><button id="close">Close</button></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map("map");L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"}).addTo(map);const rinkLayer=L.layerGroup().addTo(map),hotelLayer=L.layerGroup().addTo(map),inputLayer=L.layerGroup().addTo(map),records=[],markers=[],labels=[];let origin=null,dest=null,inputMarker=null;
const ri=()=>L.divIcon({className:"",html:'<div class="rink"></div>',iconSize:[17,17],iconAnchor:[8,8]}),hi=s=>L.divIcon({className:"",html:s?'<div class="starhotel">★</div>':'<div class="hotel">H</div>',iconSize:s?[32,32]:[27,27],iconAnchor:s?[16,16]:[13,13]});
function esc(s){return String(s||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")}function stat(){status.innerHTML="<b>From:</b> "+(origin?esc(origin.name):"not selected")+"<br><b>To:</b> "+(dest?esc(dest.name):"not selected")}function route(){if(!origin||!dest){stat();return}summary.textContent="From "+origin.name+" to "+dest.name;google.href="https://www.google.com/maps/dir/?api=1&origin="+origin.lat+","+origin.lon+"&destination="+dest.lat+","+dest.lon+"&travelmode=driving";apple.href="https://maps.apple.com/?saddr="+origin.lat+","+origin.lon+"&daddr="+dest.lat+","+dest.lon+"&dirflg=d";waze.href="https://www.waze.com/ul?ll="+dest.lat+","+dest.lon+"&navigate=yes";modal.classList.add("open")}close.onclick=()=>modal.classList.remove("open");modal.onclick=e=>{if(e.target===modal)modal.classList.remove("open")};
function pop(r){return '<div class="popup"><b>'+esc(r.name)+'</b><div>'+esc(r.address)+'</div>'+(r.star?'<div class="amenity">★ Free parking + free breakfast</div>':'')+'<button class="from">Set as START</button><button class="to">Set as DESTINATION</button></div>'}
function add(f){const [lon,lat]=f.geometry.coordinates,p=f.properties,r={name:p.name,short:p.short_name||p.name,address:p.address,type:p.type,star:!!p.free_parking_breakfast,lat,lon};records.push(r);const m=L.marker([lat,lon],{icon:r.type==="hotel"?hi(r.star):ri(),title:r.name}).bindTooltip(r.short,{permanent:true,direction:"right",offset:[r.type==="hotel"?12:8,0],className:r.type==="hotel"?"hotel-label":"facility-label"}).bindPopup(()=>pop(r)).addTo(r.type==="hotel"?hotelLayer:rinkLayer);m.on("popupopen",()=>{const e=m.getPopup().getElement();e.querySelector(".from").onclick=()=>{origin=r;map.closePopup();stat()};e.querySelector(".to").onclick=()=>{dest=r;map.closePopup();stat();if(origin)route()}});markers.push(m);labels.push({m,r})}
function zoomLabels(){let z=map.getZoom();labels.forEach(x=>{let e=x.m.getTooltip()?.getElement();if(e)e.classList.toggle("hidden-label",z<10);if(z>=10)x.m.setTooltipContent(z>=12?x.r.name:x.r.short)})}map.on("zoomend",zoomLabels);
const ctl=L.control({position:"topright"});ctl.onAdd=()=>{let d=L.DomUtil.create("div","panel");d.innerHTML='<h3>Route planner</h3><label>Find listed hotel or rink</label><input id="listedQ" placeholder="Hotel or rink name"><button id="listedBtn">Find listed location</button><label>Find any other location</label><input id="otherQ" placeholder="Address, airport, restaurant, etc."><button id="otherBtn">Find input location</button><button id="swapBtn" class="secondary">Swap start / destination</button><button id="routeBtn">Choose directions app</button><button id="allBtn" class="secondary">Zoom to all hotels & rinks</button><div id="status" class="status"></div>';L.DomEvent.disableClickPropagation(d);L.DomEvent.disableScrollPropagation(d);return d};ctl.addTo(map);
function findListed(){let q=listedQ.value.trim().toLowerCase(),i=records.findIndex(r=>r.name.toLowerCase().includes(q));if(i<0){status.textContent="No matching listed hotel or rink.";return}map.setView([records[i].lat,records[i].lon],13);markers[i].openPopup()}listedBtn.onclick=findListed;listedQ.onkeydown=e=>{if(e.key==="Enter")findListed()};
async function findOther(){let q=otherQ.value.trim();if(!q)return;status.textContent="Searching OpenStreetMap...";try{let h=(await(await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=us&q="+encodeURIComponent(q))).json())[0];if(!h){status.textContent="No matching location found.";return}let r={name:q,address:h.display_name,type:"input",lat:+h.lat,lon:+h.lon};if(inputMarker)inputLayer.removeLayer(inputMarker);inputMarker=L.marker([r.lat,r.lon]).bindTooltip(r.name,{permanent:true,direction:"right",className:"input-label"}).bindPopup(()=>pop(r)).addTo(inputLayer);inputMarker.on("popupopen",()=>{let e=inputMarker.getPopup().getElement();e.querySelector(".from").onclick=()=>{origin=r;map.closePopup();stat()};e.querySelector(".to").onclick=()=>{dest=r;map.closePopup();stat();if(origin)route()}});map.setView([r.lat,r.lon],13);inputMarker.openPopup();stat()}catch(e){status.textContent="Location search failed."}}otherBtn.onclick=findOther;otherQ.onkeydown=e=>{if(e.key==="Enter")findOther()};swapBtn.onclick=()=>{[origin,dest]=[dest,origin];stat()};routeBtn.onclick=route;allBtn.onclick=()=>map.fitBounds(L.featureGroup(markers).getBounds(),{padding:[35,35]});
async function load(){let data=await(await fetch("locations.geojson",{cache:"no-store"})).json();data.features.forEach(add);map.fitBounds(L.featureGroup(markers).getBounds(),{padding:[35,35]});zoomLabels();stat()}L.control.layers(null,{"Rinks":rinkLayer,"Hotels":hotelLayer,"Searched location":inputLayer}).addTo(map);const leg=L.control({position:"bottomleft"});leg.onAdd=()=>{let d=L.DomUtil.create("div","legend");d.innerHTML="<div>● Tournament rink</div><div>H Hotel</div><div>★ Free parking + free breakfast</div>";return d};leg.addTo(map);L.control.scale({imperial:true,metric:false}).addTo(map);load();
</script></body></html>
