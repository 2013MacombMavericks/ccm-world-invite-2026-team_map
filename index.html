<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCM World Invite — Team Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
html,body,#map{height:100%;margin:0}body{font-family:Arial,sans-serif}#map{width:100%}.title{position:absolute;z-index:1000;top:8px;left:50%;transform:translateX(-50%);background:#fffffff2;padding:8px 14px;border-radius:9px;box-shadow:0 1px 6px #0004;text-align:center}.title b{font-size:17px}.title div{font-size:11px;color:#555}.panel{background:#fffffff7;padding:10px;border-radius:8px;box-shadow:0 1px 6px #0004;width:285px;max-height:82vh;overflow:auto}.panel h3{margin:0 0 7px;font-size:14px}.panel h4{margin:12px 0 4px;font-size:12px;border-top:1px solid #ddd;padding-top:8px}.panel label{display:block;font-size:11px;font-weight:bold;margin:7px 0 3px}.panel input,.panel select{width:100%;box-sizing:border-box;padding:7px;border:1px solid #aaa;border-radius:5px;font-size:12px}.panel button{width:100%;margin-top:6px;padding:7px;border:0;border-radius:5px;background:#245a9b;color:#fff;font-weight:bold;cursor:pointer}.panel .secondary{background:#666}.cats{display:grid;grid-template-columns:1fr 1fr;gap:5px}.cats button{margin:0;font-size:11px}.status{font-size:11px;border-top:1px solid #ddd;margin-top:8px;padding-top:7px;line-height:1.4}.rink{width:13px;height:13px;border-radius:50%;background:#1f5aa6;border:2px solid #fff}.hotel{width:23px;height:23px;border-radius:5px;background:#7a2e8e;color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:bold}.starhotel{width:28px;height:28px;border-radius:50%;background:#f2b705;color:#111;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:18px}.poi{width:18px;height:18px;border-radius:50%;background:#267346;color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold}.facility-label,.hotel-label,.poi-label{font-size:8px;font-weight:600;padding:1px 3px;white-space:nowrap;box-shadow:none}.facility-label{background:#ffffffcc}.hotel-label{background:#fff8ffea;color:#5c176b}.poi-label{background:#f3fff5e8;color:#174c27}.facility-label:before,.hotel-label:before,.poi-label:before{display:none}.hidden-label{opacity:0!important}.popup b{font-size:14px}.popup div{margin:5px 0}.amenity{font-size:11px;font-weight:bold;color:#725500}.popup button{width:100%;margin-top:5px;padding:7px;border:0;border-radius:5px;background:#245a9b;color:#fff;font-weight:bold}.legend{background:#fffffff2;padding:7px 9px;border-radius:7px;box-shadow:0 1px 5px #0004;font-size:10px}.legend div{margin:3px}.modalbg{display:none;position:fixed;z-index:3000;inset:0;background:#0008;align-items:center;justify-content:center}.modalbg.open{display:flex}.modal{background:#fff;border-radius:12px;padding:18px;width:min(430px,90%)}.modal a{display:block;color:#fff;text-decoration:none;text-align:center;font-weight:bold;padding:10px;margin:8px 0;border-radius:7px}.g{background:#1a73e8}.a{background:#111}.w{background:#087e8b}.modal p{font-size:11px;color:#555}.modal button{width:100%;padding:8px}@media(max-width:700px){.panel{width:220px}.facility-label,.hotel-label,.poi-label{font-size:7px}.title b{font-size:14px}.title div{font-size:9px}}
</style></head><body><div class="title"><b>CCM World Invite — Chicago Area Team Map</b><div>Rinks, team hotels, routing, food & teen-friendly activities.</div></div><div id="map"></div>
<div id="modal" class="modalbg"><div class="modal"><h2>Choose directions</h2><p id="summary"></p><a id="google" class="g" target="_blank" rel="noopener">Google Maps</a><a id="apple" class="a" target="_blank" rel="noopener">Apple Maps</a><a id="waze" class="w" target="_blank" rel="noopener">Waze</a><p>Google Maps and Apple Maps preserve both endpoints. Waze routes to the destination from your device's current location.</p><button id="close">Close</button></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map("map");L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const rinkLayer=L.layerGroup().addTo(map),hotelLayer=L.layerGroup().addTo(map),poiLayer=L.layerGroup().addTo(map),inputLayer=L.layerGroup().addTo(map);const records=[],markers=[],labels=[];let origin=null,dest=null,inputMarker=null,searchCenter=null;
const ri=()=>L.divIcon({className:"",html:'<div class="rink"></div>',iconSize:[17,17],iconAnchor:[8,8]});const hi=s=>L.divIcon({className:"",html:s?'<div class="starhotel">★</div>':'<div class="hotel">H</div>',iconSize:s?[32,32]:[27,27],iconAnchor:s?[16,16]:[13,13]});const pi=c=>L.divIcon({className:"",html:'<div class="poi">'+c+'</div>',iconSize:[22,22],iconAnchor:[11,11]});
function esc(s){return String(s||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")}function stat(){status.innerHTML="<b>From:</b> "+(origin?esc(origin.name):"not selected")+"<br><b>To:</b> "+(dest?esc(dest.name):"not selected")+"<br><b>Food & Fun near:</b> "+(searchCenter?esc(searchCenter.name):"select a map location")}
function route(){if(!origin||!dest){stat();return}summary.textContent="From "+origin.name+" to "+dest.name;google.href="https://www.google.com/maps/dir/?api=1&origin="+origin.lat+","+origin.lon+"&destination="+dest.lat+","+dest.lon+"&travelmode=driving";apple.href="https://maps.apple.com/?saddr="+origin.lat+","+origin.lon+"&daddr="+dest.lat+","+dest.lon+"&dirflg=d";waze.href="https://www.waze.com/ul?ll="+dest.lat+","+dest.lon+"&navigate=yes";modal.classList.add("open")}close.onclick=()=>modal.classList.remove("open");modal.onclick=e=>{if(e.target===modal)modal.classList.remove("open")};
function pop(r){return '<div class="popup"><b>'+esc(r.name)+'</b><div>'+esc(r.address||"")+'</div>'+(r.star?'<div class="amenity">★ Free parking + free breakfast</div>':'')+'<button class="from">Set as START</button><button class="to">Set as DESTINATION</button><button class="near">Search Food & Fun near here</button></div>'}
function wire(m,r){m.on("popupopen",()=>{const e=m.getPopup().getElement();e.querySelector(".from").onclick=()=>{origin=r;map.closePopup();stat()};e.querySelector(".to").onclick=()=>{dest=r;map.closePopup();stat();if(origin)route()};e.querySelector(".near").onclick=()=>{searchCenter=r;map.closePopup();stat()}})}
function add(f){const [lon,lat]=f.geometry.coordinates,p=f.properties,r={name:p.name||p.facility_name,short:p.short_name||p.name||p.facility_name,address:p.address||p.full_address,type:p.type||(p.location_type==="hotel"?"hotel":"rink"),star:!!p.free_parking_breakfast,lat,lon};records.push(r);const m=L.marker([lat,lon],{icon:r.type==="hotel"?hi(r.star):ri(),title:r.name}).bindTooltip(r.short,{permanent:true,direction:"right",offset:[r.type==="hotel"?12:8,0],className:r.type==="hotel"?"hotel-label":"facility-label"}).bindPopup(()=>pop(r)).addTo(r.type==="hotel"?hotelLayer:rinkLayer);wire(m,r);markers.push(m);labels.push({m,r})}
function zoomLabels(){const z=map.getZoom();labels.forEach(x=>{const e=x.m.getTooltip()?.getElement();if(e)e.classList.toggle("hidden-label",z<10);if(z>=10)x.m.setTooltipContent(z>=12?x.r.name:x.r.short)})}map.on("zoomend",zoomLabels);
const ctl=L.control({position:"topright"});ctl.onAdd=()=>{const d=L.DomUtil.create("div","panel");d.innerHTML='<h3>Route planner</h3><label>Find listed hotel or rink</label><input id="listedQ" placeholder="Hotel or rink name"><button id="listedBtn">Find listed location</button><label>Find any other location</label><input id="otherQ" placeholder="Address, airport, restaurant, etc."><button id="otherBtn">Find input location</button><button id="swapBtn" class="secondary">Swap start / destination</button><button id="routeBtn">Choose directions app</button><h4>Food & Fun nearby</h4><label>Search radius</label><select id="radius"><option value="3219">2 miles</option><option value="8047" selected>5 miles</option><option value="16093">10 miles</option></select><div class="cats"><button data-cat="food">🍴 Food</button><button data-cat="fun">🎳 Teen Fun</button><button data-cat="treats">🍦 Treats</button><button data-cat="movies">🎬 Movies</button><button data-cat="shopping">🛍 Shopping</button><button id="clearPoi" class="secondary">Clear</button></div><button id="allBtn" class="secondary">Zoom to all hotels & rinks</button><div id="status" class="status"></div>';L.DomEvent.disableClickPropagation(d);L.DomEvent.disableScrollPropagation(d);return d};ctl.addTo(map);
function findListed(){const q=listedQ.value.trim().toLowerCase(),i=records.findIndex(r=>r.name.toLowerCase().includes(q));if(i<0){status.textContent="No matching listed hotel or rink.";return}const r=records[i],m=markers[i];map.setView([r.lat,r.lon],13);m.openPopup()}listedBtn.onclick=findListed;listedQ.onkeydown=e=>{if(e.key==="Enter")findListed()};
async function findOther(){const q=otherQ.value.trim();if(!q)return;status.textContent="Searching OpenStreetMap…";try{const h=(await(await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=us&q="+encodeURIComponent(q))).json())[0];if(!h){status.textContent="No matching location found.";return}const r={name:q,address:h.display_name,type:"input",lat:+h.lat,lon:+h.lon};if(inputMarker)inputLayer.removeLayer(inputMarker);inputMarker=L.marker([r.lat,r.lon]).bindTooltip(r.name,{permanent:true,direction:"right",className:"poi-label"}).bindPopup(()=>pop(r)).addTo(inputLayer);wire(inputMarker,r);map.setView([r.lat,r.lon],13);inputMarker.openPopup();searchCenter=r;stat()}catch(e){status.textContent="Location search failed."}}otherBtn.onclick=findOther;otherQ.onkeydown=e=>{if(e.key==="Enter")findOther()};swapBtn.onclick=()=>{[origin,dest]=[dest,origin];stat()};routeBtn.onclick=route;allBtn.onclick=()=>map.fitBounds(L.featureGroup(markers).getBounds(),{padding:[35,35]});clearPoi.onclick=()=>poiLayer.clearLayers();
const queries={food:'nwr["amenity"~"restaurant|fast_food|food_court|cafe"]',fun:'nwr["leisure"~"bowling_alley|amusement_arcade|escape_game|trampoline_park|sports_centre"];nwr["sport"~"bowling|karting"];nwr["tourism"="theme_park"]',treats:'nwr["amenity"~"ice_cream|cafe"];nwr["shop"~"bakery|confectionery"]',movies:'nwr["amenity"="cinema"]',shopping:'nwr["shop"="mall"];nwr["shop"="department_store"]'};
async function poiSearch(cat){if(!searchCenter){status.textContent="Click a hotel/rink and choose “Search Food & Fun near here” first.";return}poiLayer.clearLayers();status.textContent="Finding nearby places…";const rad=+radius.value,parts=queries[cat].split(";").map(x=>x+"(around:"+rad+","+searchCenter.lat+","+searchCenter.lon+");").join("");const q="[out:json][timeout:20];("+parts+");out center 30;";try{const data=await(await fetch("https://overpass-api.de/api/interpreter",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"data="+encodeURIComponent(q)})).json();const seen=new Set();let count=0;for(const x of data.elements){if(count>=20)break;const name=x.tags?.name;if(!name||seen.has(name))continue;seen.add(name);const lat=x.lat??x.center?.lat,lon=x.lon??x.center?.lon;if(lat==null||lon==null)continue;const r={name,address:[x.tags?.["addr:housenumber"],x.tags?.["addr:street"],x.tags?.["addr:city"]].filter(Boolean).join(" "),type:"poi",lat,lon};const m=L.marker([lat,lon],{icon:pi(cat==="food"?"F":cat==="fun"?"!":cat==="treats"?"T":cat==="movies"?"M":"S"),title:name}).bindPopup(()=>pop(r)).addTo(poiLayer);wire(m,r);count++}status.textContent=count?count+" nearby results shown.":"No mapped results found in this radius."}catch(e){status.textContent="Nearby search is temporarily unavailable. Try again shortly."}}
document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>poiSearch(b.dataset.cat));
async function load(){const data=await(await fetch("locations.geojson",{cache:"no-store"})).json();data.features.forEach(add);map.fitBounds(L.featureGroup(markers).getBounds(),{padding:[35,35]});zoomLabels();stat()}L.control.layers(null,{"Rinks":rinkLayer,"Hotels":hotelLayer,"Food & Fun":poiLayer,"Searched location":inputLayer}).addTo(map);const leg=L.control({position:"bottomleft"});leg.onAdd=()=>{const d=L.DomUtil.create("div","legend");d.innerHTML="<div>● Tournament rink</div><div>H Team hotel</div><div>★ Free parking + free breakfast</div><div>● Temporary Food & Fun result</div>";return d};leg.addTo(map);L.control.scale({imperial:true,metric:false}).addTo(map);load();
</script></body></html>
